<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>False Positives · mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="wrap">
<div class="bar"><a href="../">← false_positives</a><span>[1] eye · mirror</span></div>

<header>
  <h1>MIRROR<span class="cur">&nbsp;</span></h1>
  <p>The machine looks at you through your camera. Where you stand, the pollution it invents is cleared, as if you had breathed it in. Nothing is recorded or sent anywhere.</p>
  <p class="boot"><span class="prompt">$</span> ./false_positives --source=camera --air=live --truth=none</p>
</header>

<div class="controls">
  <div class="field"><label for="city">--city</label><select id="city"></select></div>
  <div class="field"><label for="model">--model</label><select id="model"></select></div>
  <button id="start">start camera</button>
  <button id="stop" disabled>stop</button>
</div>

<div class="status" id="status"></div>
<div class="result" id="result">
  <div class="stage"><canvas id="canvas"></canvas></div>
  <div class="readout" id="readout"></div>
</div>
</div>

<video id="video" playsinline muted hidden></video>

<script type="module">
import { getAir, fillCitySelect, cityById } from "../shared/air.js";
import { MODELS, segment, emptyMasks, makeBoxes, stepBoxes, drawFrame, readoutRows } from "../shared/detect.js";

const $ = id => document.getElementById(id);
const say = t => { $("status").innerHTML = '<span class="prompt">&gt;</span> ' + t; };
fillCitySelect($("city"));
$("model").innerHTML = MODELS.map(m => `<option value="${m.id}">${m.name}</option>`).join("");

const canvas = $("canvas"), video = $("video");
let stream = null, running = false, air = null, masks = null, boxes = [], drawn = 0;
let segCount = 0, segFps = 0, w = 0, h = 0, timers = [];

const frame = document.createElement("canvas");   // what is drawn every screen frame
const probe = document.createElement("canvas");   // what the model sees

async function refreshAir(){
  try {
    air = await getAir(cityById($("city").value));
    boxes = makeBoxes(w, h, air);
  } catch(e){ say("air: no signal."); }
}

async function start(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480 }, audio:false });
  } catch(e){ say("no camera, or permission refused."); return; }
  video.srcObject = stream;
  await video.play();

  w = 560; h = Math.round(560 * video.videoHeight / video.videoWidth);
  frame.width = probe.width = w; frame.height = probe.height = h;
  masks = emptyMasks(w, h);

  say("reading the air.");
  await refreshAir();
  if (!air) return;

  running = true;
  $("start").disabled = true; $("stop").disabled = false;
  $("result").classList.add("on");
  render();
  segLoop();
  timers = [
    setInterval(() => { segFps = segCount; segCount = 0; }, 1000),
    setInterval(report, 500),
    setInterval(refreshAir, 15*60*1000)
  ];
}

// the model is slower than the screen: masks lag the body a little, and that lag stays visible
async function segLoop(){
  const pctx = probe.getContext("2d");
  while (running){
    pctx.save(); pctx.scale(-1, 1); pctx.drawImage(video, -w, 0, w, h); pctx.restore();
    try { masks = await segment(probe, $("model").value, say); segCount++; }
    catch(e){ say("segmentation error: " + e.message); await new Promise(r => setTimeout(r, 1000)); }
    if (segCount === 1) say("watching.");
  }
}

function render(){
  if (!running) return;
  const fctx = frame.getContext("2d");
  fctx.save(); fctx.scale(-1, 1); fctx.drawImage(video, -w, 0, w, h); fctx.restore();   // mirrored
  stepBoxes(boxes, w, h, 1);
  drawn = drawFrame(canvas, frame, masks, boxes, air);
  requestAnimationFrame(render);
}

function report(){
  if (!masks || !air) return;
  const inhaled = masks.people ? `<div class="row"><span class="k">PM2.5 inhaled</span><span class="v">${((air.pm2_5||0)*0.008).toFixed(3)} µg / min</span></div>` : "";
  $("readout").innerHTML = `<h2>REPORT · LIVE</h2>${readoutRows(masks, air, boxes.length, drawn)}${inhaled}
    <div class="row"><span class="k">segmentation</span><span class="v">${segFps} fps</span></div>
    <p class="src">${air.city}, ${air.source}, hour of ${air.time}.</p>`;
}

function stop(){
  running = false;
  timers.forEach(clearInterval); timers = [];
  if (stream) stream.getTracks().forEach(t => t.stop());
  $("start").disabled = false; $("stop").disabled = true;
  say("stopped. the camera is off.");
}

$("start").onclick = start;
$("stop").onclick = stop;
$("city").onchange = () => { if (running) refreshAir(); };
</script>
</body>
</html>
